[package]
name = "pets-driven-cli"
version = "1.1.0"
description = "Command-line client for the running pets-driven desktop app"
authors = ["pets-driven"]
license = "MIT"
edition = "2021"

# The binary is `pdd`: short for pets-driven, and distinct from the desktop
# crate's `pets-driven` binary so the two never collide in the shared target
# directory.
[[bin]]
name = "pdd"
path = "src/main.rs"

[lib]
name = "pets_driven_cli"
path = "src/lib.rs"

# The CLI talks to the running desktop over the loopback protocol only. It must
# never construct a state repository or touch state.v1.json, so it depends on
# the protocol crate — not on pets-driven-core or the desktop crate. The
# loopback HTTP transport is hand-rolled over std::net to avoid a Tokio/TLS
# stack for a plain-HTTP loopback call.
[dependencies]
pets-driven-core = { path = "../pets-driven-core" }
pets-driven-fs = { path = "../pets-driven-fs" }
pets-driven-protocol = { path = "../pets-driven-protocol" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
